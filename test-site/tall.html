<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>长页面</title>
<link rel="stylesheet" href="site.css" />
<style>
  .band { height: 300px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff }
  .b0 { background: #1b4d3e }
  .b1 { background: #234e70 }
  .b2 { background: #6b2d5c }
  .b3 { background: #7a4419 }
  .b4 { background: #2f4858 }
</style>
</head>
<body>
  <!-- 抓图用的长页面：每 300px 一个色带并标出序号，
       抓到的是哪一段一眼就能认出来 -->
  <div class="band b0">SECTION-0</div>
  <div class="band b1">SECTION-1</div>
  <div class="band b2">SECTION-2</div>
  <div class="band b3">SECTION-3</div>
  <div class="band b4">SECTION-4</div>
  <div class="band b0">SECTION-5</div>
  <div class="band b1">SECTION-6</div>
  <div class="band b2">SECTION-7</div>
</body>
</html>
