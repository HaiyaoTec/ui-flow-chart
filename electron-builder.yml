appId: com.haiyaotec.flowchart
productName: Flow Chart
copyright: Copyright © 2026 Haiyao Tec

directories:
  output: release
  buildResources: build

# 只打构建产物：源码、测试、内置测试站都不进安装包
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# 依赖里只有 electron-updater 需要进包，其余（React 等）已被打进 out/
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  # 暂不做代码签名：首次安装会有 SmartScreen「未知发布者」提示，
  # README 与 Release 说明里提供 SHA256 校验值。用户量起来后再上 EV 证书。
  #
  # 这项保持 true 是为了给 exe 写入图标与版本信息。代价是 electron-builder 要解压
  # winCodeSign 工具包，其中含 macOS 的符号链接——Windows 上未开「开发者模式」时
  # 创建符号链接需要管理员权限，本地打包会失败（CI 的 runner 有该权限，不受影响）。
  # 本地要打包：开启开发者模式，或用管理员终端跑一次让缓存落地，
  # 再或临时把这项设为 false（产出的 exe 会是 Electron 默认图标）。
  signAndEditExecutable: true

mac:
  category: public.app-category.developer-tools
  # dmg 供手动下载安装；zip 是 electron-updater 在 macOS 上唯一能用的更新包格式，
  # 现在虽然没开自动更新（见下），也一并产出，将来接上时不用再改发布流程
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # 512×512 的 png，electron-builder 会自动转成 icns
  icon: build/icon.png
  # 暂不做代码签名与公证：需要 Apple Developer Program（99 USD/年）。
  # 后果与 Windows 侧不同，是功能级而非提示级——
  # 1) Gatekeeper 会拦首次打开，用户要手动去掉隔离属性（README 有命令）；
  # 2) Squirrel.Mac 校验运行中应用的签名，未签名一律无法应用内更新，
  #    所以 macOS 版在更新界面上直接标为「不支持应用内更新」，引导去 Release 页下载。
  extendInfo:
    NSDocumentsFolderUsageDescription: 用于读写导出的流程图与截图文件

nsis:
  oneClick: false
  perMachine: false # 单用户安装，免 UAC 弹窗
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flow Chart
  # 差量更新的块映射，能显著减小后续更新的下载量
  differentialPackage: true

# owner/repo 不写死：CI 与本地都从 git remote 推断，
# 换仓库或 fork 后不需要改配置
publish:
  provider: github
  releaseType: draft # 先发草稿，人工确认产物齐全再 Publish
